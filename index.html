ansparent!important}footer{font-size:9pt}}
</style></head><body><main><header><div class="sub">心理疾病職能治療學 · 基礎概念與臨床應用</div><h1>精神科職能治療：基礎概念與服務流程｜課後測驗</h1><p>15 題四選一單選題，每題僅有一個最適當答案。建議作答時間 25–30 分鐘。</p><p class="sub">每題 1 分，滿分 15 分。請依講義概念與題目情境作答。</p><div class="identity"><label>姓名 <input aria-label="姓名"></label><label>學號 <input aria-label="學號"></label></div></header><div class="tools"><button class="primary" id="grade">提交並計分</button><button id="answers" aria-pressed="false">顯示答案與解析</button><button id="print">列印／另存 PDF</button><button id="reset">清除作答</button></div><p class="sub screen-note">可離線使用，作答不會傳送至網路，重新載入後會清除。列印學生題本前，請先隱藏答案與解析。</p><div id="result" role="status" aria-live="polite"></div><form id="quiz"></form><noscript><p>JavaScript 未啟用：以下提供靜態題本與答案，啟用後可使用計分功能。</p><ol><li><p>某精神科職能治療團隊正在檢視服務使命。下列思考方式最符合講義所列的使命形成因素？</p><ol type="A"><li>只依現有器材決定服務內容，避免考慮社會需求</li><li>整合外部需求、專業能力的發展與內化，以及核心價值與社會承擔</li><li>只參考其他機構的口號，直接採用相同內容</li><li>只依單一成員偏好決定服務方向</li></ol></li><li><p>兩位具有相同精神疾病診斷的個案，一位可自行安排購物與工作，另一位在這些活動上需要協助。對職能治療評估最適當的啟示為何？</p><ol type="A"><li>相同診斷者應設定相同生活功能目標</li><li>只需比較疾病名稱，不需了解日常活動</li><li>能工作者一定沒有疾病，因此應取消其診斷</li><li>需分別了解兩人的職能表現、環境、常規與支持，不能只由診斷推定失能程度</li></ol></li><li><p>某單位同時被描述為「成人、急性、封閉式病房」。這三個詞依序對應講義中的哪三種分類向度？</p><ol type="A"><li>年齡層、病情、管理型態</li><li>病情、醫院層級、年齡層</li><li>管理型態、年齡層、病情</li><li>醫院層級、管理型態、教學功能</li></ol></li><li><p>個案因嚴重精神症狀與急性危機住院，狀態波動明顯。職能治療師在規劃活動時，何種推理最符合此場域特性與治療流程？</p><ol type="A"><li>直接沿用所有慢性病房活動，不再評估</li><li>先安排高壓競賽，以完成速度決定後續計畫</li><li>先評估當下狀態與職能需求，再選擇適切的目標與活動要求</li><li>只要完成一次活動，就視為所有生活功能已恢復</li></ol></li><li><p>長期住院個案逐漸依賴機構安排，日常活動選擇減少。若依講義指出的慢性病房特性分析，治療師應特別關注何者？</p><ol type="A"><li>只比較床位周轉率，不必了解個案活動</li><li>機構化與功能退化風險，以及生活常規、興趣和參與機會</li><li>把長期住院直接等同完全沒有學習能力</li><li>只要沒有急性症狀，就不需再評估職能表現</li></ol></li><li><p>某服務據點提供日間復健活動，個案活動結束後返回原居所，並未住在該機構。此服務型態最符合哪一項？</p><ol type="A"><li>日間型社區復健機構（社區復健中心）</li><li>住宿型社區復健機構（康復之家）</li><li>精神科加護病房</li><li>長期住院的慢性病房</li></ol></li><li><p>個案達出院標準後，團隊正在比較返家、住宿支持及社區日間服務。下列規劃何者最符合講義的照護銜接觀點？</p><ol type="A"><li>所有個案一律轉往同一機構，以簡化流程</li><li>只要離開醫院，即可忽略後續生活需求</li><li>僅依疾病名稱決定去向，不需了解生活安排</li><li>依個別生活與支持需求比較不同去向，並規劃下一階段服務銜接</li></ol></li><li><p>介入一段時間後，個案生活情境改變，原先設定的目標已不符合需要。依講義，最適當的處理為何？</p><ol type="A"><li>仍完成原計畫全部內容，結案後才能修改</li><li>重新轉介前不能進行任何評估</li><li>再評估職能表現與需求，據以調整目標及介入計畫</li><li>只以最初的評估結果判定目前療效</li></ol></li><li><p>個案表示：「我最想恢復的是接孩子放學，但現在每天的作息很亂。」下列資料蒐集方向最符合職能樣貌？</p><ol type="A"><li>僅記錄診斷與藥物，不再詢問生活內容</li><li>了解接送角色、生活常規、環境與支持，以及個案目標的優先順序</li><li>只測單一身體功能，以測驗分數取代個案陳述</li><li>由治療師選定最熟悉的活動，無須確認個案重視的事情</li></ol></li><li><p>治療師已取得醫學資料，接下來要擬定治療計畫。依講義呈現的資料蒐集與分析架構，何者最適當？</p><ol type="A"><li>僅憑醫學診斷即可決定所有介入內容</li><li>只使用一份測驗，忽略與其他資料的差異</li><li>把會談與測驗結果分開保存，不進行綜合分析</li><li>結合醫學資料、會談及適切測驗，分析相關功能與生活層面後擬定計畫</li></ol></li><li><p>評估發現個案無法規律完成早餐準備，而他希望恢復獨立生活。下列規劃何者最符合講義中職能問題、目標與介入的關係？</p><ol type="A"><li>先釐清早餐準備的困難與優先目標，再選擇相應策略並擬定、執行計畫</li><li>先選治療師最喜歡的活動，再要求個案將它當作目標</li><li>先決定固定療程，不論表現與需求都不調整</li><li>只寫「改善所有能力」，不需連結具體職能問題</li></ol></li><li><p>個案同時希望恢復工作、料理三餐與參加社交活動。依職能樣貌中的「個案目標」，治療師最適當的做法為何？</p><ol type="A"><li>只選最容易測量的目標，不需詢問個案</li><li>三個目標必須同時以完全相同強度介入</li><li>了解個案渴望的成果與生活需求，協助形成目標優先次序</li><li>將所有目標視為不切實際，先全部刪除</li></ol></li><li><p>治療師將就學、工作、首次就醫、住院與社區服務經驗放在同一條時序圖上。這項整理最主要能協助什麼？</p><ol type="A"><li>只計算住院次數，不必考慮角色與活動</li><li>以時間順序直接證明每個事件之間都有因果關係</li><li>以疾病史取代興趣、環境與個案目標等所有資料</li><li>理解生活角色、職能經驗與健康及服務歷程之間的時間脈絡</li></ol></li><li><p>個案完成部分治療目標，但仍在一項重要日常活動上遇到困難。下列結案或續療決策何者最符合講義？</p><ol type="A"><li>只要完成任何一個目標就必須立即結案</li><li>再評估職能表現與療效，據以決定持續、調整治療或結案</li><li>只依已完成活動的次數決定，無須看功能變化</li><li>只要仍有疾病診斷，就永遠不能結案</li></ol></li><li><p>團隊為即將出院的個案討論後續居住安排、服務去向與支持銜接。這最能呈現出院計畫的哪一項核心意義？</p><ol type="A"><li>協助個案從目前照護層級轉銜至下一階段照護與生活安排</li><li>只完成離院當天的行政文件，不需後續安排</li><li>只適用於違反醫囑出院者</li><li>確認離開病房後，所有服務均必須立即停止</li></ol></li></ol><details><summary>參考答案與解析</summary><p><strong>1. B</strong>：講義指出，使命形成涉及外部需求、專業能力的發展和內化，以及個人核心價值與社會承擔。因此服務方向需連結需求、能力與價值，而非只看器材或個人偏好。（第 10 張）</p><p><strong>2. D</strong>：疾病診斷與生活功能不是同一層次的描述。依講義的疾病／失能討論及職能樣貌架構，仍須了解個別活動能力、阻礙與生活脈絡，不能由相同診斷直接推定相同功能。（第 9、13–14、51 張）</p><p><strong>3. A</strong>：講義依年齡層、病情與管理型態分類病房。成人屬年齡層，急性屬病情，封閉式屬管理型態；不同向度可以同時描述同一單位。（第 17 張）</p><p><strong>4. C</strong>：急性病房的場域特性包括高度不穩定與急性危機。依評估、目標設定與介入的流程，活動要求應反映當下需求，而非不經評估直接套用固定方案。（第 23、40、46 張）</p><p><strong>5. B</strong>：講義指出慢性病房有長期住院及機構化、功能退化風險。結合職能樣貌，應了解生活常規、興趣與實際參與，而不是以住院時間或症狀穩定取代功能評估。（第 24、46、51 張）</p><p><strong>6. A</strong>：講義區分日間型與住宿型社區復健機構，並以社區復健中心、康復之家為例。題目以日間參與、結束後返家及未在機構住宿作為辨別線索。（第 25、27 張）</p><p><strong>7. D</strong>：講義呈現出院後多種生活與服務選項，並將出院計畫定位為不同照護層級間的轉銜。去向不應只由單一診斷或行政方便決定。（第 22、27、48 張）</p><p><strong>8. C</strong>：講義強調職能治療是循環而非單向線性歷程。再評估可支持持續治療、調整治療或結案的決策，不能將最初計畫視為不可修改。（第 40–41 張）</p><p><strong>9. B</strong>：職能樣貌包括主訴及其職能關聯、有效與受阻的活動、職能史、興趣價值、情境、常規與個案目標。題幹所述角色與作息均是重要資訊。（第 51 張）</p><p><strong>10. D</strong>：講義以醫學資料、會談與標準化測驗等蒐集資訊，並進行跨層面分析。治療計畫須建立在資料整合上，不能由單一來源直接取代全部臨床推理。（第 45 張）</p><p><strong>11. A</strong>：講義將職能問題、職能目標、治療計畫與策略方法相連結。介入選擇應回應已辨識的問題及目標，並透過後續再評估檢視效果。（第 44、46 張）</p><p><strong>12. C</strong>：講義指出個案可能有數個渴望達成的目標，且具有優先次序。目標設定需要理解其意義與生活脈絡，而不是只依治療師方便決定。（第 51 張）</p><p><strong>13. D</strong>：職能史不只列疾病事件，也涉及發展、就學與就業等經驗。時序圖有助於掌握角色及活動變化的脈絡，但時間先後本身不能證明因果。（第 51–52 張）</p><p><strong>14. B</strong>：講義在再評估階段連結職能表現、治療療效及結案或調整治療的決策。決定不能只依完成次數、單一目標或診斷是否仍存在。（第 40–41、47 張）</p><p><strong>15. A</strong>：講義將 discharge planning 說明為病人從一個照護層級轉銜到下一個層級的過程。因此重點在照護延續與銜接，而不僅是離院手續。（第 48 張）</p></details></noscript><footer>命題依據：《115-1 01 課程簡介 feedback》講義（共 53 張投影片）。範圍：專業使命、疾病與失能、服務場域、職能治療流程、職能樣貌與出院銜接。情境為依講義概念改寫；解析頁次依檔案中的投影片順序計算。課堂討論回饋不視為標準答案。</footer></main><script>
const questions=[{"topic": "專業使命", "ref": "第 10 張", "q": "某精神科職能治療團隊正在檢視服務使命。下列思考方式最符合講義所列的使命形成因素？", "o": ["只依現有器材決定服務內容，避免考慮社會需求", "整合外部需求、專業能力的發展與內化，以及核心價值與社會承擔", "只參考其他機構的口號，直接採用相同內容", "只依單一成員偏好決定服務方向"], "a": 1, "e": "講義指出，使命形成涉及外部需求、專業能力的發展和內化，以及個人核心價值與社會承擔。因此服務方向需連結需求、能力與價值，而非只看器材或個人偏好。"}, {"topic": "疾病與失能的辨析", "ref": "第 9、13–14、51 張", "q": "兩位具有相同精神疾病診斷的個案，一位可自行安排購物與工作，另一位在這些活動上需要協助。對職能治療評估最適當的啟示為何？", "o": ["相同診斷者應設定相同生活功能目標", "只需比較疾病名稱，不需了解日常活動", "能工作者一定沒有疾病，因此應取消其診斷", "需分別了解兩人的職能表現、環境、常規與支持，不能只由診斷推定失能程度"], "a": 3, "e": "疾病診斷與生活功能不是同一層次的描述。依講義的疾病／失能討論及職能樣貌架構，仍須了解個別活動能力、阻礙與生活脈絡，不能由相同診斷直接推定相同功能。"}, {"topic": "病房分類向度", "ref": "第 17 張", "q": "某單位同時被描述為「成人、急性、封閉式病房」。這三個詞依序對應講義中的哪三種分類向度？", "o": ["年齡層、病情、管理型態", "病情、醫院層級、年齡層", "管理型態、年齡層、病情", "醫院層級、管理型態、教學功能"], "a": 0, "e": "講義依年齡層、病情與管理型態分類病房。成人屬年齡層，急性屬病情，封閉式屬管理型態；不同向度可以同時描述同一單位。"}, {"topic": "急性病房情境", "ref": "第 23、40、46 張", "q": "個案因嚴重精神症狀與急性危機住院，狀態波動明顯。職能治療師在規劃活動時，何種推理最符合此場域特性與治療流程？", "o": ["直接沿用所有慢性病房活動，不再評估", "先安排高壓競賽，以完成速度決定後續計畫", "先評估當下狀態與職能需求，再選擇適切的目標與活動要求", "只要完成一次活動，就視為所有生活功能已恢復"], "a": 2, "e": "急性病房的場域特性包括高度不穩定與急性危機。依評估、目標設定與介入的流程，活動要求應反映當下需求，而非不經評估直接套用固定方案。"}, {"topic": "慢性病房情境", "ref": "第 24、46、51 張", "q": "長期住院個案逐漸依賴機構安排，日常活動選擇減少。若依講義指出的慢性病房特性分析，治療師應特別關注何者？", "o": ["只比較床位周轉率，不必了解個案活動", "機構化與功能退化風險，以及生活常規、興趣和參與機會", "把長期住院直接等同完全沒有學習能力", "只要沒有急性症狀，就不需再評估職能表現"], "a": 1, "e": "講義指出慢性病房有長期住院及機構化、功能退化風險。結合職能樣貌，應了解生活常規、興趣與實際參與，而不是以住院時間或症狀穩定取代功能評估。"}, {"topic": "社區復健機構", "ref": "第 25、27 張", "q": "某服務據點提供日間復健活動，個案活動結束後返回原居所，並未住在該機構。此服務型態最符合哪一項？", "o": ["日間型社區復健機構（社區復健中心）", "住宿型社區復健機構（康復之家）", "精神科加護病房", "長期住院的慢性病房"], "a": 0, "e": "講義區分日間型與住宿型社區復健機構，並以社區復健中心、康復之家為例。題目以日間參與、結束後返家及未在機構住宿作為辨別線索。"}, {"topic": "照護場域與轉銜", "ref": "第 22、27、48 張", "q": "個案達出院標準後，團隊正在比較返家、住宿支持及社區日間服務。下列規劃何者最符合講義的照護銜接觀點？", "o": ["所有個案一律轉往同一機構，以簡化流程", "只要離開醫院，即可忽略後續生活需求", "僅依疾病名稱決定去向，不需了解生活安排", "依個別生活與支持需求比較不同去向，並規劃下一階段服務銜接"], "a": 3, "e": "講義呈現出院後多種生活與服務選項，並將出院計畫定位為不同照護層級間的轉銜。去向不應只由單一診斷或行政方便決定。"}, {"topic": "職能治療的循環流程", "ref": "第 40–41 張", "q": "介入一段時間後，個案生活情境改變，原先設定的目標已不符合需要。依講義，最適當的處理為何？", "o": ["仍完成原計畫全部內容，結案後才能修改", "重新轉介前不能進行任何評估", "再評估職能表現與需求，據以調整目標及介入計畫", "只以最初的評估結果判定目前療效"], "a": 2, "e": "講義強調職能治療是循環而非單向線性歷程。再評估可支持持續治療、調整治療或結案的決策，不能將最初計畫視為不可修改。"}, {"topic": "職能樣貌的資料蒐集", "ref": "第 51 張", "q": "個案表示：「我最想恢復的是接孩子放學，但現在每天的作息很亂。」下列資料蒐集方向最符合職能樣貌？", "o": ["僅記錄診斷與藥物，不再詢問生活內容", "了解接送角色、生活常規、環境與支持，以及個案目標的優先順序", "只測單一身體功能，以測驗分數取代個案陳述", "由治療師選定最熟悉的活動，無須確認個案重視的事情"], "a": 1, "e": "職能樣貌包括主訴及其職能關聯、有效與受阻的活動、職能史、興趣價值、情境、常規與個案目標。題幹所述角色與作息均是重要資訊。"}, {"topic": "評估與資料整合", "ref": "第 45 張", "q": "治療師已取得醫學資料，接下來要擬定治療計畫。依講義呈現的資料蒐集與分析架構，何者最適當？", "o": ["僅憑醫學診斷即可決定所有介入內容", "只使用一份測驗，忽略與其他資料的差異", "把會談與測驗結果分開保存，不進行綜合分析", "結合醫學資料、會談及適切測驗，分析相關功能與生活層面後擬定計畫"], "a": 3, "e": "講義以醫學資料、會談與標準化測驗等蒐集資訊，並進行跨層面分析。治療計畫須建立在資料整合上，不能由單一來源直接取代全部臨床推理。"}, {"topic": "目標與介入的連結", "ref": "第 44、46 張", "q": "評估發現個案無法規律完成早餐準備，而他希望恢復獨立生活。下列規劃何者最符合講義中職能問題、目標與介入的關係？", "o": ["先釐清早餐準備的困難與優先目標，再選擇相應策略並擬定、執行計畫", "先選治療師最喜歡的活動，再要求個案將它當作目標", "先決定固定療程，不論表現與需求都不調整", "只寫「改善所有能力」，不需連結具體職能問題"], "a": 0, "e": "講義將職能問題、職能目標、治療計畫與策略方法相連結。介入選擇應回應已辨識的問題及目標，並透過後續再評估檢視效果。"}, {"topic": "個案目標與優先次序", "ref": "第 51 張", "q": "個案同時希望恢復工作、料理三餐與參加社交活動。依職能樣貌中的「個案目標」，治療師最適當的做法為何？", "o": ["只選最容易測量的目標，不需詢問個案", "三個目標必須同時以完全相同強度介入", "了解個案渴望的成果與生活需求，協助形成目標優先次序", "將所有目標視為不切實際，先全部刪除"], "a": 2, "e": "講義指出個案可能有數個渴望達成的目標，且具有優先次序。目標設定需要理解其意義與生活脈絡，而不是只依治療師方便決定。"}, {"topic": "職能史的用途", "ref": "第 51–52 張", "q": "治療師將就學、工作、首次就醫、住院與社區服務經驗放在同一條時序圖上。這項整理最主要能協助什麼？", "o": ["只計算住院次數，不必考慮角色與活動", "以時間順序直接證明每個事件之間都有因果關係", "以疾病史取代興趣、環境與個案目標等所有資料", "理解生活角色、職能經驗與健康及服務歷程之間的時間脈絡"], "a": 3, "e": "職能史不只列疾病事件，也涉及發展、就學與就業等經驗。時序圖有助於掌握角色及活動變化的脈絡，但時間先後本身不能證明因果。"}, {"topic": "再評估與療程決策", "ref": "第 40–41、47 張", "q": "個案完成部分治療目標，但仍在一項重要日常活動上遇到困難。下列結案或續療決策何者最符合講義？", "o": ["只要完成任何一個目標就必須立即結案", "再評估職能表現與療效，據以決定持續、調整治療或結案", "只依已完成活動的次數決定，無須看功能變化", "只要仍有疾病診斷，就永遠不能結案"], "a": 1, "e": "講義在再評估階段連結職能表現、治療療效及結案或調整治療的決策。決定不能只依完成次數、單一目標或診斷是否仍存在。"}, {"topic": "出院計畫的核心", "ref": "第 48 張", "q": "團隊為即將出院的個案討論後續居住安排、服務去向與支持銜接。這最能呈現出院計畫的哪一項核心意義？", "o": ["協助個案從目前照護層級轉銜至下一階段照護與生活安排", "只完成離院當天的行政文件，不需後續安排", "只適用於違反醫囑出院者", "確認離開病房後，所有服務均必須立即停止"], "a": 0, "e": "講義將 discharge planning 說明為病人從一個照護層級轉銜到下一個層級的過程。因此重點在照護延續與銜接，而不僅是離院手續。"}];const form=document.getElementById('quiz');const letters='ABCD';let visible=false,graded=false;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
questions.forEach((q,i)=>{const a=el('article');const fs=el('fieldset');const legend=el('legend');legend.append(el('h2','',`${i+1}. ${q.q}`));fs.append(legend);q.o.forEach((o,j)=>{const l=el('label','option');l.id=`q${i}o${j}`;const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;l.append(r,el('span','',letters[j]+'. '+o));fs.append(l)});const e=el('div','explanation hidden');e.append(el('strong','',`答案：${letters[q.a]} ｜ ${q.topic}`),el('p','',q.e),el('p','source','講義依據：'+q.ref));a.append(fs,el('div','feedback'),e);form.append(a)});
function clearMarks(){document.querySelectorAll('.option').forEach(n=>n.classList.remove('correct','wrong'));document.querySelectorAll('.feedback').forEach(n=>n.textContent='')}
function show(v){visible=v;document.querySelectorAll('.explanation').forEach(n=>n.classList.toggle('hidden',!v));document.getElementById('answers').textContent=v?'隱藏答案與解析':'顯示答案與解析';document.getElementById('answers').setAttribute('aria-pressed',String(v))}
document.getElementById('grade').onclick=()=>{clearMarks();let score=0,done=0;questions.forEach((q,i)=>{const r=form.querySelector(`input[name="q${i}"]:checked`);const f=form.children[i].querySelector('.feedback');if(r){done++;const v=Number(r.value);if(v===q.a){score++;f.textContent='答對'}else{f.textContent=`答錯，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${v}`).classList.add('wrong')}}else f.textContent=`未作答，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${q.a}`).classList.add('correct')});document.getElementById('result').textContent=`得分 ${score}／15 分（${Math.round(score/15*100)}%）・已答 ${done} 題・未答 ${15-done} 題。未答題以 0 分計。`;graded=true;show(true)};
document.getElementById('answers').onclick=()=>{show(!visible);if(!visible){clearMarks();graded=false;document.getElementById('result').textContent=''}};
form.addEventListener('change',()=>{if(graded){clearMarks();graded=false;document.getElementById('result').textContent='作答已變更，請重新提交計分。'}});
document.getElementById('reset').onclick=()=>{form.reset();clearMarks();show(false);graded=false;document.getElementById('result').textContent='已清除作答。'};document.getElementById('print').onclick=()=>window.print();
</script></body></html>
